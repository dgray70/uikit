<!DOCTYPE html>
<html>

<head>
    <title>Lottery</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- UIkit CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uikit@3.25.16/dist/css/uikit.min.css" />

    <!-- UIkit JS -->
    <script src="https://cdn.jsdelivr.net/npm/uikit@3.25.16/dist/js/uikit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/uikit@3.25.16/dist/js/uikit-icons.min.js"></script>
</head>

<body>
    <h1 class="uk-heading-small uk-text-center">Lottery Website</h1>

    <div class="uk-container uk-margin-top">

        <!-- RULES -->
        <div class="uk-background-muted uk-padding uk-panel">
            <p class="uk-text-center">
                Pick numbers and try your luck! Each match wins $3. Powerball adds $10.
            </p>
        </div>

        <!-- TICKET TYPE -->
        <div class="uk-margin-top">
            <label><input class="uk-radio" type="radio" name="ticket" value="basic"> Basic (3 numbers, 1-20)</label><br>
            <label><input class="uk-radio" type="radio" name="ticket" value="standard"> Standard (5 numbers, 1-50)</label><br>
            <label><input class="uk-radio" type="radio" name="ticket" value="mega"> Mega (6 numbers, 1-60)</label>
        </div>

        <!-- PICKS -->
        <div class="uk-margin">
            <input id="picks" class="uk-input" type="text" placeholder="Enter numbers separated by spaces">
        </div>

        <!-- POWERBALL -->
        <div class="uk-margin">
            <label><input id="powerballCheck" class="uk-checkbox" type="checkbox"> Powerball (+$2)</label>
            <input id="powerballPick" class="uk-input uk-margin-small-top" type="number" placeholder="Powerball (1-10)">
        </div>

        <!-- PLAY BUTTON -->
        <button class="uk-button uk-button-primary" onclick="play()">Let's Play!</button>

        <!-- RESULTS -->
        <div class="uk-margin-top uk-grid-small uk-child-width-1-2" uk-grid>
            <div>
                <h4>Winning Numbers</h4>
                <div id="winningNums"></div>
            </div>

            <div>
                <h4>Powerball</h4>
                <div id="winningPB"></div>
            </div>
        </div>

        <div class="uk-margin-top">
            <h4>Results</h4>
            <div id="results"></div>
        </div>

        <div class="uk-margin-top">
            <h4>Summary</h4>
            <div>Total Spent: <span id="spent">0</span></div>
            <div>Total Won: <span id="won">0</span></div>
            <div>Profit: <span id="profit">0</span></div>
        </div>

    </div>

    <script src="./js/main.js"></script>
</body>

</html>
